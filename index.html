<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Galería</title>
<style>
  :root{
    --bg:#14141a;
    --card:#1e1e26;
    --card-hover:#26262f;
    --text:#f2f1ee;
    --text-muted:#9a99a3;
    --accent:#6f6bd6;
    --border:#2c2c36;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:'Segoe UI', Roboto, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    padding:2.5rem 2rem 1.5rem;
    text-align:center;
  }
  header h1{
    margin:0;
    font-size:2rem;
    font-weight:600;
  }
  .breadcrumb{
    color:var(--text-muted);
    margin-top:.5rem;
    font-size:.95rem;
  }
  .breadcrumb span{
    cursor:pointer;
    color:var(--accent);
  }
  .breadcrumb span:hover{ text-decoration:underline; }
  main{
    max-width:1100px;
    margin:0 auto;
    padding:0 2rem 4rem;
  }
  .back-btn{
    display:inline-block;
    margin-bottom:1.5rem;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:.5rem 1rem;
    border-radius:8px;
    cursor:pointer;
    font-size:.9rem;
  }
  .back-btn:hover{ background:var(--card-hover); }

  .menu-principal{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:1.5rem;
    max-width:800px;
    margin:2rem auto;
  }
  .menu-card{
    aspect-ratio:1/1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:.75rem;
    cursor:pointer;
    transition:.2s ease;
  }
  .menu-card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    background:var(--card-hover);
  }
  .menu-card .icono{ font-size:2.5rem; }
  .menu-card .nombre{ font-size:1.15rem; font-weight:600; }
  .menu-card .cuenta{ font-size:.85rem; color:var(--text-muted); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:1.25rem;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    cursor:pointer;
    transition:.2s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
  }
  .thumb{
    width:100%;
    aspect-ratio:3/4;
    background:linear-gradient(135deg,#2a2a35,#1a1a22);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-muted);
    font-size:.8rem;
    overflow:hidden;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .info{
    padding:.9rem 1rem 1.1rem;
    display:flex;
    flex-direction:column;
    gap:.35rem;
    flex:1;
  }
  .info h3{ margin:0; font-size:1rem; font-weight:600; line-height:1.3; }
  .info .cuenta{ font-size:.8rem; color:var(--text-muted); }
  .info a{
    margin-top:auto;
    display:inline-block;
    text-align:center;
    background:var(--accent);
    color:#fff;
    text-decoration:none;
    padding:.5rem;
    border-radius:8px;
    font-size:.85rem;
    font-weight:500;
  }
  .info a:hover{ opacity:.9; }
  .empty{
    text-align:center;
    color:var(--text-muted);
    padding:3rem 0;
  }
</style>
</head>
<body>

<header>
  <h1>Mi Galería</h1>
  <div class="breadcrumb" id="breadcrumb"></div>
</header>

<main id="main"></main>

<!-- Ichika: textos, datos, logica, contenedor -->
<script type="module">
  import { ichika } from './galerias/ichika/ichika_contenedor.js';
  import { categorias } from './contenedores.js';
  
  window.categorias = categorias;
</script>

<script>
  // ruta: [] = menu principal, ["galerias"] = lista de chicas,
  // ["galerias", idxChica] = subgalerias de esa chica,
  // ["galerias", idxChica, idxSub] = fotos de esa subgaleria
  let ruta = [];

  const main = document.getElementById("main");
  const breadcrumb = document.getElementById("breadcrumb");
  const iconos = { galerias: "🖼️" };

  function irAMenu(){ ruta = []; render(); }
  function irANivel(nivel){ ruta = ruta.slice(0, nivel); render(); }

  function render(){
    renderBreadcrumb();
    main.innerHTML = "";

    if(ruta.length === 0){
      renderMenuPrincipal();
    } else if(ruta.length === 1){
      renderLista(categorias[ruta[0]], "Volver al inicio", irAMenu);
    } else if(ruta.length === 2){
      const chica = categorias[ruta[0]].subgalerias[ruta[1]];
      renderLista(chica, `Volver a ${categorias[ruta[0]].titulo}`, () => irANivel(1));
    } else if(ruta.length === 3){
      const chica = categorias[ruta[0]].subgalerias[ruta[1]];
      const sub = chica.subgalerias[ruta[2]];
      renderItems(sub, `Volver a ${chica.titulo}`, () => irANivel(2));
    }
  }

  function renderBreadcrumb(){
    let html = `<span onclick="irAMenu()">Inicio</span>`;
    if(ruta.length >= 1){
      const cat = categorias[ruta[0]];
      html += ` / <span onclick="irANivel(1)">${cat.titulo}</span>`;
    }
    if(ruta.length >= 2){
      const chica = categorias[ruta[0]].subgalerias[ruta[1]];
      html += ` / <span onclick="irANivel(2)">${chica.titulo}</span>`;
    }
    if(ruta.length >= 3){
      const chica = categorias[ruta[0]].subgalerias[ruta[1]];
      const sub = chica.subgalerias[ruta[2]];
      html += ` / ${sub.titulo}`;
    }
    breadcrumb.innerHTML = html;
  }

  function renderMenuPrincipal(){
    const menu = document.createElement("div");
    menu.className = "menu-principal";

    Object.keys(categorias).forEach(cat => {
      const info = categorias[cat];
      const div = document.createElement("div");
      div.className = "menu-card";
      div.innerHTML = `
        <div class="icono">${iconos[cat] || "📁"}</div>
        <div class="nombre">${info.titulo}</div>
        <div class="cuenta">${info.subgalerias.length} elementos</div>
      `;
      div.addEventListener("click", () => { ruta = [cat]; render(); });
      menu.appendChild(div);
    });

    main.appendChild(menu);
  }

  function renderLista(nodo, textoVolver, accionVolver){
    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = `← ${textoVolver}`;
    back.addEventListener("click", accionVolver);
    main.appendChild(back);

    if(!nodo.subgalerias || nodo.subgalerias.length === 0){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Todavía no hay contenido aquí.";
      main.appendChild(empty);
      return;
    }

    const grid = document.createElement("div");
    grid.className = "grid";
    main.appendChild(grid);

    nodo.subgalerias.forEach((item, idx) => {
      const card = document.createElement("div");
      card.className = "card";

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      thumb.innerHTML = item.portada
        ? `<img src="${item.portada}" alt="${item.titulo}">`
        : "Sin portada";

      const cantidad = item.subgalerias
        ? `${item.subgalerias.length} subgalerías`
        : `${item.items.length} elementos`;

      const infoDiv = document.createElement("div");
      infoDiv.className = "info";
      infoDiv.innerHTML = `
        <h3>${item.titulo}</h3>
        <div class="cuenta">${cantidad}</div>
      `;

      card.appendChild(thumb);
      card.appendChild(infoDiv);
      card.addEventListener("click", () => { ruta = [...ruta, idx]; render(); });
      grid.appendChild(card);
    });
  }

  function renderItems(sub, textoVolver, accionVolver){
    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = `← ${textoVolver}`;
    back.addEventListener("click", accionVolver);
    main.appendChild(back);

    if(sub.items.length === 0){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Todavía no hay fotos aquí.";
      main.appendChild(empty);
      return;
    }

    const grid = document.createElement("div");
    grid.className = "grid";
    main.appendChild(grid);

    sub.items.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.cursor = "default";

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      thumb.innerHTML = item.imagen
        ? `<img src="${item.imagen}" alt="${item.nombre}">`
        : "Sin imagen";

      const infoDiv = document.createElement("div");
      infoDiv.className = "info";
      infoDiv.innerHTML = `
        <h3>${item.nombre}</h3>
        <a href="${item.link}" target="_blank" rel="noopener">Ver en Drive</a>
      `;

      card.appendChild(thumb);
      card.appendChild(infoDiv);
      grid.appendChild(card);
    });
  }

  render();
</script>

</body>
</html>
